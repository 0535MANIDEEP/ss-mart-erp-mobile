name: ss_mart
description: SS MART - Sai Sangameshwara Mart Retail ERP System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

# Local Database
  drift: '2.33.0'
  sqlite3_flutter_libs: ^0.5.15

  # Dependency Injection
  get_it: ^7.6.4

  # Navigation
  go_router: ^12.1.1

  # Network
  http: ^1.1.0
  connectivity_plus: ^5.0.1

  # Storage
  shared_preferences: ^2.2.2
  # flutter_secure_storage: ^9.0.0

  # Functional Programming
  dartz: ^0.10.1

  # Utilities
  uuid: ^4.2.1
  intl: ^0.18.1
  path_provider: ^2.1.1

  # UI
  flutter_svg: ^2.0.9
  qr_flutter: ^4.1.0

  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.11.1

  # Barcode Scanner (camera-based)
  mobile_scanner: ^5.2.3

  # Permissions
  permission_handler: ^11.1.0

  # Path
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: '2.33.0'
  build_runner: '2.15.1'
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
